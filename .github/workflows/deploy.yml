name: Deploy to Debian Server

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Moindre privilège pour le GITHUB_TOKEN
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Uniquement si la CI de main est verte (ou déclenchement manuel)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      # Actions épinglées par SHA (protection contre la compromission d'un tag)
      - name: Deploy to server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          script: |
            set -e
            cd /opt/portfolio-cyber
            git pull --ff-only origin main
            docker-compose down
            docker-compose up -d --build
            docker-compose exec -T app npx prisma migrate deploy
            echo "Deployment completed"
